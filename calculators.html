<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1 class="brand"><a href="index.html">Revenue Dynamics Advisors</a></h1>

        <a href="index.html">Home</a>

  </header>
  <main class="container">
    <h2>Calculators</h2>

    <section class="calc card">
      <h3>Income Tax Calculator (basic)</h3>
      <label>Annual Income (₹)</label>
      <input type="number" id="income" placeholder="e.g. 600000" />
      <button class="btn primary" onclick="calcTax()">Calculate</button>
      <p id="taxResult" class="result"></p>
      <small class="muted">Note: Simplified estimate only.</small>
    </section>

    <section class="calc card">
      <h3>GST Calculator</h3>
      <label>Amount (₹)</label>
      <input type="number" id="gstAmount" placeholder="e.g. 1000" />
      <label>GST %</label>
      <input type="number" id="gstRate" placeholder="e.g. 18" value="18" />
      <button class="btn primary" onclick="calcGST()">Calculate</button>
      <p id="gstResult" class="result"></p>
    </section>

    <section class="calc card">
      <h3>EMI Calculator</h3>
      <label>Loan amount (₹)</label>
      <input type="number" id="loanAmount" placeholder="e.g. 100000" />
      <label>Annual Interest Rate (%)</label>
      <input type="number" id="annualRate" placeholder="e.g. 10" />
      <label>Tenure (years)</label>
      <input type="number" id="tenureYears" placeholder="e.g. 5" />
      <button class="btn primary" onclick="calcEMI()">Calculate</button>
      <p id="emiResult" class="result"></p>
    </section>
  </main>
  <script src="assets/calculators.js"></script>

  </footer>
</body>
</html>
